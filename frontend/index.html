<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMail AI - Cinematic Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background gradient */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
            animation: breathe 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        header {
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.9) 0%, rgba(10, 10, 10, 0.95) 100%);
            color: white;
            padding: 50px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -1px;
            position: relative;
            z-index: 1;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.6;
            position: relative;
            z-index: 1;
            color: #e0e0e0;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .content {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: #e0e0e0;
            font-size: 0.95em;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 1em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            backdrop-filter: blur(10px);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-control:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
        }

        textarea.form-control {
            resize: vertical;
            font-family: inherit;
        }

        .recipient-input-wrapper {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .recipient-input-wrapper .form-control {
            flex: 1;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-small {
            padding: 10px 20px;
            font-size: 0.9em;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .btn-small:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffffff 0%, #d0d0d0 100%);
            color: #000;
            width: 100%;
            padding: 18px;
            font-size: 1.1em;
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.1);
        }

        .btn-primary:hover {
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 30px;
            margin-top: 8px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 0.9em;
            color: #e0e0e0;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .tag:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .tag .remove {
            cursor: pointer;
            font-weight: bold;
            color: #ff6b6b;
            transition: color 0.2s;
        }

        .tag .remove:hover {
            color: #ff5252;
        }

        .attachments-list {
            margin-top: 12px;
        }

        .attachment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 10px;
            color: #e0e0e0;
            transition: all 0.3s;
        }

        .attachment-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .attachment-remove {
            color: #ff6b6b;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.3em;
            transition: color 0.2s;
        }

        .attachment-remove:hover {
            color: #ff5252;
        }

        .ai-section {
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .ai-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.02) 50%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .ai-section h3 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 1.3em;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .status-message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 18px 24px;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: none;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-message.show {
            display: block;
            animation: slideInBounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes slideInBounce {
            0% {
                transform: translateX(400px);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .status-message.success {
            background: rgba(76, 175, 80, 0.15);
            color: #81c784;
            border-color: rgba(76, 175, 80, 0.3);
        }

        .status-message.error {
            background: rgba(244, 67, 54, 0.15);
            color: #e57373;
            border-color: rgba(244, 67, 54, 0.3);
        }

        .status-message.loading {
            background: rgba(255, 152, 0, 0.15);
            color: #ffb74d;
            border-color: rgba(255, 152, 0, 0.3);
        }

        .info-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid rgba(255, 255, 255, 0.3);
            padding: 18px 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            color: #e0e0e0;
            backdrop-filter: blur(10px);
        }

        .info-box strong {
            color: #ffffff;
            font-weight: 600;
        }

        .btn-generate {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.1) 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-generate:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.15) 100%);
            border-color: rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 2em;
            }

            .content {
                padding: 25px;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📧 SmartMail AI</h1>
            <p class="subtitle">Cinematic Edition</p>
        </header>

        <div class="content">
            <!-- Sender Info Display -->
            <div class="info-box">
                <strong>📧 Sending from:</strong> <span id="sender-display">Loading...</span>
            </div>

            <!-- Recipients -->
            <div class="form-group">
                <label for="to-input">To:</label>
                <div class="recipient-input-wrapper">
                    <input type="email" id="to-input" class="form-control" placeholder="recipient@example.com">
                    <button onclick="addRecipient('to')" class="btn btn-small">Add</button>
                </div>
                <div id="to-tags" class="tags-container"></div>
            </div>

            <div class="form-group">
                <label for="cc-input">CC (Optional):</label>
                <div class="recipient-input-wrapper">
                    <input type="email" id="cc-input" class="form-control" placeholder="cc@example.com">
                    <button onclick="addRecipient('cc')" class="btn btn-small">Add</button>
                </div>
                <div id="cc-tags" class="tags-container"></div>
            </div>

            <div class="form-group">
                <label for="bcc-input">BCC (Optional):</label>
                <div class="recipient-input-wrapper">
                    <input type="email" id="bcc-input" class="form-control" placeholder="bcc@example.com">
                    <button onclick="addRecipient('bcc')" class="btn btn-small">Add</button>
                </div>
                <div id="bcc-tags" class="tags-container"></div>
            </div>

            <!-- Subject -->
            <div class="form-group">
                <label for="subject-input">Subject:</label>
                <input type="text" id="subject-input" class="form-control" placeholder="Email subject" required>
            </div>

            <!-- AI Section -->
            <div class="ai-section">
                <h3>🤖 AI Email Generation</h3>
                <div class="form-group">
                    <label for="prompt-input">What do you want to write about?</label>
                    <textarea id="prompt-input" class="form-control" rows="3" 
                        placeholder="Example: Request a meeting next week to discuss the project timeline"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="tone-select">Tone:</label>
                        <select id="tone-select" class="form-control">
                            <option value="professional">Professional</option>
                            <option value="casual">Casual</option>
                            <option value="formal">Formal</option>
                            <option value="friendly">Friendly</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>&nbsp;</label>
                        <button onclick="generateEmail()" class="btn btn-small btn-generate" style="width: 100%;">
                            ✨ Generate Email
                        </button>
                    </div>
                </div>
            </div>

            <!-- Email Body -->
            <div class="form-group">
                <label for="body-input">Email Body:</label>
                <textarea id="body-input" class="form-control" rows="10" placeholder="Type your email content here..." required></textarea>
            </div>

            <!-- Attachments -->
            <div class="form-group">
                <label>Attachments (Optional):</label>
                <input type="file" id="file-input" class="form-control" multiple>
                <div id="attachments-list" class="attachments-list"></div>
            </div>

            <!-- Send Button -->
            <button onclick="sendEmail()" class="btn btn-primary">
                📤 Send Email
            </button>
        </div>
    </div>

    <!-- Status Message -->
    <div id="status-message" class="status-message"></div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        let recipients = { to: [], cc: [], bcc: [] };
        let uploadedFiles = [];
        let senderEmail = '';

        // AI Email Generation Function
        async function generateEmail() {
            const prompt = document.getElementById('prompt-input').value.trim();
            const tone = document.getElementById('tone-select').value;
            
            if (!prompt) {
                showStatus('Please enter what you want to write about', 'error');
                return;
            }
            
            try {
                showStatus('🤖 AI is generating your email...', 'loading');
                
                const response = await fetch(`${API_BASE}/ai/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        tone: tone
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'AI generation failed');
                }
                
                const result = await response.json();
                document.getElementById('body-input').value = result.generated_text;
                showStatus('✨ Email generated successfully!', 'success');
                
            } catch (error) {
                showStatus('❌ ' + error.message, 'error');
                console.error('Generation error:', error);
            }
        }

        async function loadSenderInfo() {
            try {
                const response = await fetch(`${API_BASE}/sender-info`);
                
                if (response.ok) {
                    const data = await response.json();
                    senderEmail = data.email;
                    document.getElementById('sender-display').textContent = data.email;
                } else {
                    document.getElementById('sender-display').innerHTML = 
                        '<span style="color: #ff6b6b;">⚠️ Not configured. Check backend .env file</span>';
                }
            } catch (error) {
                document.getElementById('sender-display').innerHTML = 
                    '<span style="color: #ff6b6b;">⚠️ Backend not running. Start: python main.py</span>';
            }
        }

        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('status-message');
            statusEl.className = `status-message ${type} show`;
            statusEl.textContent = message;
            
            if (type !== 'loading') {
                setTimeout(() => {
                    statusEl.classList.remove('show');
                }, 5000);
            }
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function addRecipient(type) {
            const input = document.getElementById(`${type}-input`);
            const email = input.value.trim();
            
            if (!email) return;
            
            if (!validateEmail(email)) {
                showStatus('Invalid email address', 'error');
                return;
            }
            
            if (recipients[type].includes(email)) {
                showStatus('Email already added', 'error');
                return;
            }
            
            recipients[type].push(email);
            renderRecipients(type);
            input.value = '';
        }

        function removeRecipient(type, email) {
            recipients[type] = recipients[type].filter(e => e !== email);
            renderRecipients(type);
        }

        function renderRecipients(type) {
            const container = document.getElementById(`${type}-tags`);
            container.innerHTML = '';
            
            recipients[type].forEach(email => {
                const tag = document.createElement('div');
                tag.className = 'tag';
                tag.innerHTML = `${email} <span class="remove" onclick="removeRecipient('${type}', '${email}')">×</span>`;
                container.appendChild(tag);
            });
        }

        async function handleFileUpload() {
            const fileInput = document.getElementById('file-input');
            const files = fileInput.files;
            
            if (files.length === 0) return;
            
            for (let file of files) {
                const formData = new FormData();
                formData.append('file', file);
                
                try {
                    showStatus(`Uploading ${file.name}...`, 'loading');
                    
                    const response = await fetch(`${API_BASE}/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (!response.ok) throw new Error('Upload failed');
                    
                    const data = await response.json();
                    uploadedFiles.push(data);
                    renderAttachments();
                    showStatus(`${file.name} uploaded`, 'success');
                } catch (error) {
                    showStatus(`Failed to upload ${file.name}`, 'error');
                    console.error('Upload error:', error);
                }
            }
            
            // Clear the file input so same file can be uploaded again
            fileInput.value = '';
        }

        function renderAttachments() {
            const container = document.getElementById('attachments-list');
            container.innerHTML = '';
            
            uploadedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'attachment-item';
                item.innerHTML = `
                    <span>📎 ${file.filename} (${formatFileSize(file.size)})</span>
                    <span class="attachment-remove" onclick="removeAttachment(${index}, '${file.filename}')">×</span>
                `;
                container.appendChild(item);
            });
        }

        async function removeAttachment(index, filename) {
            try {
                await fetch(`${API_BASE}/upload/${filename}`, {
                    method: 'DELETE'
                });
                
                uploadedFiles.splice(index, 1);
                renderAttachments();
                showStatus('Attachment removed', 'success');
            } catch (error) {
                showStatus('Failed to remove attachment', 'error');
            }
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        async function sendEmail() {
            const subject = document.getElementById('subject-input').value.trim();
            const body = document.getElementById('body-input').value.trim();
            
            if (!senderEmail) {
                showStatus('Sender not configured. Check backend .env', 'error');
                return;
            }
            
            if (recipients.to.length === 0) {
                showStatus('Please add at least one recipient', 'error');
                return;
            }
            
            if (!subject) {
                showStatus('Please enter a subject', 'error');
                return;
            }
            
            if (!body) {
                showStatus('Please enter email content', 'error');
                return;
            }
            
            const emailData = {
                to: recipients.to.map(email => ({ email })),
                cc: recipients.cc.map(email => ({ email })),
                bcc: recipients.bcc.map(email => ({ email })),
                subject: subject,
                body: body
            };
            
            try {
                showStatus('Sending email... 📤', 'loading');
                
                const response = await fetch(`${API_BASE}/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(emailData)
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to send email');
                }
                
                showStatus('✅ Email sent successfully!', 'success');
                
                // Only reset form after successful send
                setTimeout(() => {
                    resetForm();
                }, 2000);
                
            } catch (error) {
                showStatus('❌ ' + error.message, 'error');
            }
        }

        function resetForm() {
            recipients = { to: [], cc: [], bcc: [] };
            uploadedFiles = [];
            
            ['to', 'cc', 'bcc'].forEach(type => renderRecipients(type));
            
            document.getElementById('subject-input').value = '';
            document.getElementById('body-input').value = '';
            document.getElementById('prompt-input').value = '';
            document.getElementById('attachments-list').innerHTML = '';
        }

        ['to', 'cc', 'bcc'].forEach(type => {
            document.getElementById(`${type}-input`).addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addRecipient(type);
                }
            });
        });

        window.addEventListener('DOMContentLoaded', loadSenderInfo);
    </script>
</body>
</html>
