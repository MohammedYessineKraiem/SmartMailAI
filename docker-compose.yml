version: '3.8'

services:
  smartmail:
    build: .
    container_name: smartmail
    ports:
      - "8000:8000"
    environment:
      # Allow container to connect to Ollama on host machine
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      # Map host.docker.internal to host machine IP
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist uploads folder
      - ./backend/uploads:/app/uploads
    restart: unless-stopped