version: '3.8'

services:
  smartmail:
    build: .
    container_name: smartmail
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
